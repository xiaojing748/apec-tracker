name: Update APEC News

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/main.py

      - name: Build static pages
        run: python build_html.py

      - name: Commit and push
        id: commit
        run: |
          mkdir -p web/data docs/data docs/archive
          cp data/articles.json web/data/articles.json
          cp data/articles.json docs/data/articles.json
          cp index.html docs/index.html
          cp archive.html docs/archive.html
          cp -r archive docs/ 2>/dev/null || true
          cp daily-report.md docs/daily-report.md 2>/dev/null || true
          TOTAL=$(python -c "import json;d=json.load(open('data/articles.json'));print(d['total_articles'])")
          TODAY=$(python -c "import json;d=json.load(open('data/articles.json'));print(d.get('today_count',0))")
          ARCHIVE=$(python -c "import json;d=json.load(open('archive/index.json'));print(d.get('total',0))" 2>/dev/null || echo "0")
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "new_count=${TODAY}" >> $GITHUB_OUTPUT
          echo "archive_count=${ARCHIVE}" >> $GITHUB_OUTPUT

          git config user.name "APEC Bot"
          git config user.email "bot@apec-tracker.local"
          git add data/articles.json data/url_snapshot.json web/data/articles.json docs/ docs/daily-report.md "APEC动态看板.html" archive.html archive/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update: $(TZ='Asia/Shanghai' date +'%Y-%m-%d') [${TOTAL} articles / +${TODAY} new / archive ${ARCHIVE}]"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send WeChat notification
        if: always()
        run: python scraper/wechat_notify.py
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}

      # Optional: keep email as fallback if QQ mail credentials are still configured
      - name: Send email notification (optional)
        if: always() && env.QQMAIL_SENDER != '' && env.QQMAIL_AUTH_CODE != ''
        run: python scraper/notify.py
        env:
          QQMAIL_SENDER: ${{ secrets.QQMAIL_SENDER }}
          QQMAIL_AUTH_CODE: ${{ secrets.QQMAIL_AUTH_CODE }}
          QQMAIL_RECEIVER: ${{ secrets.QQMAIL_RECEIVER }}
